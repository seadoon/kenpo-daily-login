name: Daily Kenpo Login

on:
  schedule:
    - cron: '45 23 * * 0-4'  # 平日 08:45 JST (日〜木 23:45 UTC)
  workflow_dispatch:         # 手動実行も可能

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Kenpo portal
        id: login
        env:
          KENPO_NO: ${{ secrets.KENPO_NO }}
          KENPO_ID: ${{ secrets.KENPO_ID }}
          KENPO_PWD: ${{ secrets.KENPO_PWD }}
        run: |
          python3 - <<'EOF'
          import os, sys, re
          import requests

          base_url = "https://dk.kenpo.gr.jp/portal"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
          }
          session = requests.Session()
          session.headers.update(headers)

          # セッションクッキーを取得
          login_page = session.get(f"{base_url}/login.asp")
          print(f"GET login.asp: {login_page.status_code}")

          # ログイン POST（Referer付き）
          resp = session.post(f"{base_url}/auth.asp", data={
              "NO":    os.environ["KENPO_NO"],
              "ID":    os.environ["KENPO_ID"],
              "PWD":   os.environ["KENPO_PWD"],
              "login": "ログイン",
          }, headers={"Referer": f"{base_url}/login.asp"},
          allow_redirects=True)

          print(f"HTTP status: {resp.status_code}")
          print(f"Final URL:   {resp.url}")

          text = resp.content.decode("shift-jis", errors="replace")

          # エラーメッセージをページから抽出
          error_matches = re.findall(r'(?:エラー|error|失敗|invalid|incorrect|wrong)[^\n<]{0,80}', text, re.IGNORECASE)
          for m in error_matches[:5]:
              print(f"Page message: {m.strip()}")

          if "login.asp" in resp.url:
              print("::error::Login failed – redirected back to login page (check credentials)")
              sys.exit(1)

          if resp.status_code != 200:
              print(f"::error::Login failed – HTTP {resp.status_code}")
              sys.exit(1)

          # 今月のログイン回数を抽出（例: "今月ログイン 11回目"）
          m = re.search(r'今月[^\d]*(\d+)[^\d]*回', text)
          login_count = m.group(1) if m else "?"
          print(f"Login count this month: {login_count}")

          # GitHub Actions の出力変数に書き出す
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"login_count={login_count}\n")

          print("Login succeeded.")
          EOF

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOGIN_COUNT: ${{ steps.login.outputs.login_count }}
        run: |
          if [ "$LOGIN_COUNT" = "?" ]; then
            COUNT_MSG="今月のログイン回数を取得できませんでした。"
          else
            COUNT_MSG="今月 **${LOGIN_COUNT}回目** のログインです。"
          fi

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"✅ けんぽポータル ログイン成功\",
                \"description\": \"${COUNT_MSG}\n毎月10回達成で100ptゲット！\",
                \"color\": 3066993,
                \"footer\": { \"text\": \"DK健保組合ポータル\" },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"❌ けんぽポータル ログイン失敗\",
                \"description\": \"自動ログインに失敗しました。認証情報を確認してください。\n[Actions ログを確認](https://github.com/seadoon/kenpo-daily-login/actions)\",
                \"color\": 15158332,
                \"footer\": { \"text\": \"DK健保組合ポータル\" },
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"
